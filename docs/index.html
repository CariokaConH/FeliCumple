  <script>
    const balloonContainer = document.querySelector('.hearts-container');
    const confettiContainer = document.getElementById('confetti-container');
    const michi = document.getElementById('michi');

    // CAMBIADO: Lista variada con globos de múltiples colores y efectos de fiesta
    const partyElements = ['🎈', '🔵', '🟢', '🟡', '💜', '✨', '🎉'];
    
    // Paleta de colores para el confeti
    const confettiColors = ['#ff007f', '#00f0ff', '#ffca3a', '#70e000', '#b100ff', '#ff5e00'];

    // 1. Crear globos grandes en los laterales
    function createSideBalloon() {
      const balloon = document.createElement('div');
      balloon.classList.add('balloon');
      balloon.innerHTML = partyElements[Math.floor(Math.random() * partyElements.length)];

      const containerWidth = balloonContainer.offsetWidth;
      const isLeft = Math.random() < 0.5;
      let randomX;
      
      if (isLeft) {
        randomX = Math.random() * (containerWidth * 0.22);
      } else {
        randomX = (containerWidth * 0.78) + Math.random() * (containerWidth * 0.22);
      }

      balloon.style.left = randomX + 'px';
      // CAMBIADO: Tamaño de globos aumentado (ahora varían entre 30px y 48px)
      balloon.style.fontSize = (Math.random() * 18 + 30) + 'px';
      balloon.style.animationDuration = (Math.random() * 1.2 + 2) + 's'; 

      balloonContainer.appendChild(balloon);
      setTimeout(() => { balloon.remove(); }, 3500);
    }
    setInterval(createSideBalloon, 350);

    // 2. Función para generar el estallido de confeti
    function burstConfetti() {
      const confettiCount = 55; 
      
      for (let i = 0; i < confettiCount; i++) {
        const p = document.createElement('div');
        p.classList.add('confetti-piece');
        
        const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        // CAMBIADO: Confeti ligeramente más grande y vistoso
        const sizeWidth = Math.random() * 10 + 8 + 'px';
        const sizeHeight = Math.random() * 14 + 8 + 'px';
        
        const destinationX = (Math.random() - 0.5) * 380 + 'px';
        const destinationY = (Math.random() - 0.6) * 320 - 60 + 'px'; 
        const rotation = Math.random() * 720 + 'deg';

        p.style.backgroundColor = color;
        p.style.width = sizeWidth;
        p.style.height = sizeHeight;
        p.style.setProperty('--x', destinationX);
        p.style.setProperty('--y', destinationY);
        p.style.setProperty('--r', rotation);
        
        if (Math.random() > 0.5) p.style.borderRadius = '50%';

        confettiContainer.appendChild(p);
        setTimeout(() => { p.remove(); }, 2000);
      }
    }

    michi.addEventListener('click', burstConfetti);
  </script>
